    <line x1="50" y1="16" x2="50" y2="23" transform="rotate(45 50 50)" />
    <line x1="50" y1="16" x2="50" y2="23" transform="rotate(67.5 50 50)" />
    <line x1="50" y1="16" x2="50" y2="23" transform="rotate(90 50 50)" />
    <line x1="50" y1="16" x2="50" y2="23" transform="rotate(112.5 50 50)" />
    <line x1="50" y1="16" x2="50" y2="23" transform="rotate(135 50 50)" />
    <line x1="50" y1="16" x2="50" y2="23" transform="rotate(157.5 50 50)" />
    <line x1="50" y1="16" x2="50" y2="23" transform="rotate(180 50 50)" />
    <line x1="50" y1="16" x2="50" y2="23" transform="rotate(202.5 50 50)" />
    <line x1="50" y1="16" x2="50" y2="23" transform="rotate(225 50 50)" />
