  <!-- Eye Outer Shape -->
  <path d="M 31 50 C 40 36, 60 36, 69 50 C 60 64, 40 64, 31 50 Z"
        fill="none"
        stroke="#d49b41"
        stroke-width="6"
        stroke-linejoin="round" />

  <!-- Eye Pupil -->
